name: Build Storm Sensitivity APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          python -m pip install --upgrade "pip==23.3.2"
          python -m pip install "buildozer==1.5.0" "Cython==0.29.33"

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          workdir: StormSensitivity-Android
          buildozer_version: 1.5.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StormSensitivity-APK
          path: StormSensitivity-Android/bin/*.apk